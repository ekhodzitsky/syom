[package]
name = "syom"
version = "0.7.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
authors = ["Evgeny Khodzitsky"]
description = "AAC to planar f32. LC, HE-AAC, AAC-LD. ADTS, M4A, LATM. Zero deps."
readme = "README.md"
repository = "https://github.com/ekhodzitsky/syom"
homepage = "https://github.com/ekhodzitsky/syom"
documentation = "https://docs.rs/syom"
keywords = ["aac", "he-aac", "adts", "m4a", "latm"]
categories = ["multimedia::audio", "multimedia::encoding"]
autobenches = false
# The crate ships the library only (TASK-99): tests, goldens, benches, lab,
# corpus and tooling stay in the repository. `scripts/check-package.py`
# enforces the list, the empty dependency table and the size budget.
include = [
    "/src/**/*.rs",
    "!/src/**/*_tests.rs",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/NOTICE",
    "/Cargo.toml",
]

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[dependencies]
# Intentionally empty — pure std.

[dev-dependencies]
criterion = "0.8"
oxideav-aac = "0.1.7"
rusty_aac = "0.5.0"
symphonia = { version = "0.6", default-features = false, features = ["aac", "isomp4"] }

[[bench]]
name = "aac"
harness = false

[[bench]]
name = "mem"
harness = false

[[bench]]
name = "mem_iso"
harness = false

[[bench]]
name = "baseline"
harness = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[profile.bench]
lto = "thin"
codegen-units = 1
