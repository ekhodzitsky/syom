[package]
name = "syom-lab-quality"
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT"
description = "Isolated same-bitrate encoder quality baseline (TASK-16). Not a workspace member."

[dependencies]
syom = { path = "../.." }
syom-lab-score = { path = "../score" }

[[bin]]
name = "syom_quality"
path = "src/main.rs"

[[bin]]
name = "syom_ath"
path = "src/ath.rs"

[[bin]]
name = "syom_tonality"
path = "src/tonality.rs"

[[bin]]
name = "syom_curves"
path = "src/curves.rs"

[[bin]]
name = "syom_speed"
path = "src/speed.rs"
