[package]
name="fft-native-diagnostic"
version="0.0.0"
edition="2021"
publish=false
[workspace]
[dependencies]
syom-old={package="syom",path="../../.."}
syom-new={package="syom",path="../syom-fft"}
[profile.release]
lto=true
codegen-units=1
opt-level=3
[[bin]]
name="fft-native-old"
path="src/old.rs"
[[bin]]
name="fft-native-new"
path="src/new.rs"
