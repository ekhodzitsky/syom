[package]
name="syom-direct-attribution"
version="0.0.0"
edition="2021"
publish=false
[workspace]
[dependencies]
syom={path="../../../.."}
anyhow="1"
rubato="=5.0.1"
[features]
default=["file-decode"]
file-decode=[]
[profile.release]
lto=true
codegen-units=1
opt-level=3

[[bin]]
name="syom-direct-attribution"
path="src/main.rs"
[[bin]]
name="syom-io-allocation-attribution"
path="src/alloc.rs"

[[bin]]
name="syom-resampler-attribution"
path="src/resampler.rs"
[[bin]]
name="syom-io-timing"
path="src/io_timing.rs"
