[package]
name = "syom-lab-fuzz"
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT"
description = "Isolated std mutational parser and stateful stream fuzz (TASK-48/49). Not a workspace member."

[dependencies]
syom = { path = "../.." }

[[bin]]
name = "syom_fuzz"
